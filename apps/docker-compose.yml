version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    # POSTGRES_DB is not set because init.sql creates the smarthome database itself
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # TCP check: during initialization postgres listens only on the unix socket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: smarthome-temperature-api
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: smarthome-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - smarthome-network

  # Creates the topics once, so consumers do not start before their topics exist
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: smarthome-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in device.commands device.command-results device.telemetry; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1 || exit 1
        done
    restart: "no"
    networks:
      - smarthome-network

  heating-service:
    build:
      context: ./heating-service
      dockerfile: Dockerfile
    container_name: smarthome-heating-service
    depends_on:
      app:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      - MONOLITH_URL=http://app:8080
      - KAFKA_BROKER=kafka:9092
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: smarthome-telemetry-service
    depends_on:
      app:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      - KAFKA_BROKER=kafka:9092
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - smarthome-network

  device-gateway:
    build:
      context: ./device-gateway
      dockerfile: Dockerfile
    container_name: smarthome-device-gateway
    depends_on:
      app:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      - MONOLITH_URL=http://app:8080
      - KAFKA_BROKER=kafka:9092
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
